name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Lint (Biome)
        run: pnpm lint
      - name: Format (Biome)
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (including isolated media workers)
        run: pnpm test:unit
      - name: Knip (unused code)
        run: pnpm knip
      - name: Dependency Cruiser (architecture)
        run: pnpm depcheck
      - name: Build
        run: pnpm build
